name":"Fifty-two","value":52,"aliases":["52"]},{"id":"13","name":"Fifty-four","value":54,"aliases":["54"]},{"id":"14","name":"Fifty-six","value":56,"aliases":["56"]},{"id":"15","name":"Sixty","value":60,"aliases":["60"]},{"id":"16","name":"Sixty-two","value":62,"aliases":["62"]},{"id":"17","name":"Sixty-four","value":64,"aliases":["64"]},{"id":"18","name":"Sixty-six","value":66,"aliases":["66"]}],"defaultMode":"high","input":"text","boundary":"1–100 inclusive · Spell it in English · No E","source":"https://www.collinsdictionary.com/word-lists/number-cardinal-numbers","hints":["Write a number in words and look for the letter E. Two and four both work; three does not. Try a bigger number the same way.","Thirty and sixty have no E. You can add another number word, but check every letter: a single E makes the whole answer invalid.","Forty-two and fifty-six both count. You can use either, or find a bigger one with no E. Writing digits is fine once you have checked its spelling."],"low":"Lowest value wins.","high":"The biggest number wins.","target":0,"targetText":"","safeScope":"Whole numbers from 1 to 100 inclusive. Check the standard English cardinal spelling for the forbidden letter. Spaces and hyphens are ignored. Digits may be typed; the full word is privately confirmed."},{"id":"card-alphabet","subject":"Shuffle the words","prompt":"Choose a standard playing-card rank.","goal":"The last alphabetically, spelled out, wins.","scope":"The 13 ranks, two to ten, jack, queen, king and ace. English words, not digits. Suits do not matter. Tiles follow ordinary card rank, with ace last; they are not in alphabetical answer order.","metric":"Alphabetical position","unit":"alphabet","entries":[{"id":"0","name":"Two","value":13,"aliases":["2"]},{"id":"1","name":"Three","value":12,"aliases":["3"]},{"id":"2","name":"Four","value":4,"aliases":["4"]},{"id":"3","name":"Five","value":3,"aliases":["5"]},{"id":"4","name":"Six","value":10,"aliases":["6"]},{"id":"5","name":"Seven","value" ","metric":"Alphabetical position","unit":"alphabet","entries":[{"id":"0","name":"Albania","value":1,"aliases":[]},{"id":"1","name":"Algeria","value":2,"aliases":[]},{"id":"2","name":"Andorra","value":3,"aliases":[]},{"id":"3","name":"Angola","value":4,"aliases":[]},{"id":"4","name":"Antigua and Barbuda","value":5,"aliases":["antigua & barbuda"]},{"id":"5","name":"Argentina","value":6,"aliases":[]},{"id":"6","name":"Armenia","value":7,"aliases":[]},{"id":"7","name":"Australia","value":8,"aliases":[]},{"id":"8","name":"Austria","value":9,"aliases":[]},{"id":"9","name":"Central African Republic","value":10,"aliases":["car"]},{"id":"10","name":"Saint Kitts and Nevis","value":11,"aliases":["st kitts and nevis"]},{"id":"11","name":"Saint Vincent and the Grenadines","value":12,"aliases":["st vincent and the grenadines"]},{"id":"12","name":"Seychelles","value":13,"aliases":[]},{"id":"13","name":"Solomon Islands","value":14,"aliases":[]}],"defaultMode":"high","input":"text","boundary":"Same first and last letter · UN member countries","source":"https://www.un.org/about-us/member-states","hints":["Albania and Australia both start and finish with A. They both count. You are trying to find a valid country later in the alphabet.","Seychelles starts and finishes with S. Austria starts and finishes with A. Both count; you can choose one, or find another.","Argentina and Solomon Islands both count. Spaces do not matter: compare just the first and last letters of the whole country name."],"low":"Lowest value wins.","high":"The last alphabetically wins.","target":0,"targetText":"","safeScope":"UN member states whose whole familiar short English names start and end with the same letter. Ignore spaces, punctuation and a leading article. Shortened nicknames are not separate countries."},{"id":"zodiac-alphabet","subject":"Animal order","prompt":"Name a Chinese zodiac animal.","goal":"The last alphabetically wins.","scope":"The 12 standard English animal names, compared alphabetically rather than in zodiac-cycle order. Sheep/ram map to Goat; mouse maps to Rat; chicken/cockerel map to Rooster; boar maps to Pig. The confirmation shows the name used.","metric":"Alphabetical position","unit":"alphabet","entries":[{"id":"0","name":"Rat","value":9,"aliases":["mouse"]},{"id":"1","name":"Ox","value":6,"aliases":["cow","buffalo"]},{"id":"2","name":"Tiger","value":12,"aliases":[]},{"id":"3","name":"Rabbit","value":8,"aliases":[]},{"id":"4","name":"Dragon","value":2,"aliases":[]},{"id":"5","name":"Snake","value":11,"aliases":[]},{"id":"6","name":"Horse","value":4,"aliases":[]},{"id":"7","name":"Goat","value":3,"aliases":["sheep","ram"]},{"id":"8","name":"Monkey","value":5,"aliases":[]},{"id":"9","name":"Rooster","value":10,"aliases":["chicken","cockerel"]},{"id":"10","name":"Dog","value":1,"aliases":[]},{"id":"11","name":"Pig","value":7,"aliases":["boar"]}],"defaultMode":"high","input":"text","boundary":"Traditional 12 animals · English names · A–Z","source":"https://www.rmg.co.uk/stories/topics/chinese-zodiac-animals","hints":["Tiger, Dragon and Rabbit all count. Think of their English spellings and compare the first letters. Later in the alphabet ranks better.","Goat, Horse and Dog are all valid. Use Goat rather than Sheep for the alphabet ranking. You may choose one of these if you are stuck.","Rat, Rooster and Pig are valid. Rat and Rooster begin with R, so compare the next letter. You are sorting names, not animal sizes."],"low":"Lowest value wins.","high":"The last alphabetically wins.","target":0,"targetText":"","safeScope":"The twelve traditional Chinese zodiac animals. Compare the canonical English names alphabetically, not the order of the cycle. Regional aliases are privately confirmed as the name used for scoring."}],[{"id":"uk-coin-weight","subject":"Pocket judgement","prompt":"Choose a standard UK coin denomination.","goal":"The lightest coin wins.","scope":"Royal Mint specifications for the eight modern circulating denominations, using the twelve-sided pound coin. No commemorative or bullion coins. Compare weight, not face value or diameter.","metric":"Royal Mint standard weight","unit":"grams","entries":[{"id":"0","name":"1p","value":3.56,"aliases":["one penny","penny"]},{"id":"1","name":"2p","value":7.12,"aliases":["two pence"]},{"id":"2","name":"5p","value":3.25,"aliases":["five pence"]},{"id":"3","name":"10p","value":6.5,"aliases":["ten pence"]},{"id":"4","name":"20p","value":5,"aliases":["twenty pence"]},{"id":"5","name":"50p","value":8,"aliases":["fifty pence"]},{"id":"6","name":"£1","value":8.75,"aliases":["one pound","1 pound"]},{"id":"7","name":"£2","value":12,"aliases":["two pounds","2 pounds"]}],"defaultMode":"low","input":"grid","boundary":"Eight modern denominations · Weight, not value","source":"https://www.royalmint.com/globalassets/kids/activity-packs/mintlings_maths_p1.pdf","hints":["The smallest value is not always the lightest coin. Picture a little silver 5p beside a copper 1p. Think about size and thickness together.","A 2p is worth less than a 10p, but it is quite a chunky coin. You want a coin that feels light in your hand, not the cheapest one.","Think of the small silver coins you might get as change. Compare those with the heavier pound coins. Any different valid choice can still score."],"low":"The lightest coin wins.","high":"The heaviest coin wins.","target":0,"targetText":"","order":"natural","safeScope":"Royal Mint specifications for the eight modern circulating denominations, using the twelve-sided pound coin. No commemorative or bullion coins. Compare weight, not face value or diameter."},{"id":"coin-diameter","subject":"Big change","prompt":"Choose a standard modern US coin denomination.","goal":"The physically widest coin wins.","scope":"US Mint standard specifications for the six denominations. The dollar is the modern small dollar, not a historic large silver dollar. No bullion or commemorative coins.","metric":"Coin diameter","unit":"mm","entries":[{"id":"0","name":"P function distance(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function match(raw,q){const n=norm(raw);if(!n)return{kind:'empty'};const candidates=q.entries.map(e=>({e,keys:[e.name,...e.aliases].map(norm)}));const exact=candidates.filter(c=>c.keys.includes(n));if(exact.length===1)return{kind:'exact',entry:exact[0].e};if(exact.length>1)return{kind:'ambiguous'};const ranked=candidates.map(c=>({entry:c.e,d:Math.min(...c.keys.map(k=>distance(n,k)))})).sort((a,b)=>a.d-b.d);const best=ranked[0],limit=n.length>8?3:n.length>4?2:1;if(best.d<=limit&&best.d/Math.max(n.length,norm(best.entry.name).length)<=.3&&(!ranked[1]||ranked[1].d>best.d))return{kind:'typo',entry:best.entry};return{kind:'unknown'}}
function evaluate(q,answers,mode){let counts={};for(const a of answers)if(a.key!==null)counts[a.key]=(counts[a.key]||0)+1;let rows=answers.map((a,i)=>{const e=q.entries.find(e=>e.id===a.key),valid=!!e,duplicate=valid&&counts[a.key]>1;return{...a,player:i,entry:e,valid,duplicate,points:valid&&!duplicate?1:0,quality:valid?(mode==='target'?Math.abs(e.value-q.target):mode==='high'?-e.value:e.value):Infinity}});const eligible=rows.filter(r=>r.valid&&!r.duplicate),best=eligible.length?Math.min(...eligible.map(r=>r.quality)):Infinity;rows.forEach(r=>{r.winner=r.valid&&!r.duplicate&&r.quality===best;if(r.winner)r.points=3});return rows}

function robotAnnounce(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),voices=speechSynthesis.getVoices(),english=voices.filter(v=>/^en/i.test(v.lang));u.voice=english.find(v=>/robot|synthe|computer|compact/i.test(v.name))||english[0]||null;u.pitch=.25;u.rate=.9;u.volume=.85;speechSynthesis.speak(u)}catch{}}
function preferences(){modal('<p class="eyebrow">KEEP IT YOUR WAY</p><h2>Settings</h2><div class="setting row"><div><strong>Sound effects</strong><p>Short effects. No surprise soundtrack.</p></div><button class="toggle '+(prefs.sound?'on':'')+'" data-action="sound-toggle">'+(prefs.sound?'On':'Off')+'</button></div><div class="setting row"><div><strong>Robot announcer</strong><p>Short, low-pitched spoken results.</p></div><button class="toggle '+(prefs.announcer?'on':'')+'" data-action="announcer-toggle">'+(prefs.announcer?'On':'Off')+'</button></div><p class="small muted">The optional answer timer is chosen before a new game. Your preferences are remembered on this device.</p><p class="small muted">Answers and scores stay on this device. No account needed.</p>'+button('Play the opening sting','intro','secondary'))}
function rules(){modal('<p class="eyebrow">THE SHORT VERSION</p><h2>Know the answer.<br>Don’t be obvious.</h2><p>Choose the strongest answer you think nobody else will give. Pass the phone and answer in secret. Matching answers are destroyed: the perils of being obvious.</p>'+pointsPanel()+'<p>Every copy of a matching answer is cancelled, even with different spellings. If nobody survives, nobody scores. Over five rounds, most points wins. Tied champions share the glory.</p><p class="small muted">Different answers with equal values remain distinct; if tied best, each earns 3 total. Every question states its boundaries.</p>')}
function detail(){const finished=['leaderboard','final'].includes(s.stage)||(s.stage==='reveal'&&s.phase>=5);modal('<p class="eyebrow">THE SMALL PRINT, MERCIFULLY SMALL</p><h2>'+esc(question.subject)+'</h2><p>'+esc(finished?question.scope:question.safeScope)+'</p><p class="small muted">'+question.entries.length+' possible answers. A recognised spelling correction is confirmed privately; rank stays hidden until the reveal.</p>'+(finished&&question.source?'<a href="'+esc(question.source)+'" target="_blank" rel="noopener noreferrer">Question source ↗</a>':'<p class="small muted">The reference and full answer ranking are available after the reveal.</p>'))}
function ranking(){const entries=question.entries.slice().sort((a,b)=>(s.mode==='target'?Math.abs(a.value-question.target)-Math.abs(b.value-question.target):s.mode==='high'?b.value-a.value:a.value-b.value)||a.name.localeCompare(b.name));modal('<p class="eyebrow">THE FULL PICTURE</p><h2>Answer ranking</h2><p class="small muted">Strongest first for this challenge. Matching answers were cancelled before awarding the bonus.</p>'+entries.map(e=>'<div class="setting row"><strong>'+esc(e.name)+'</strong><span class="small muted">'+esc(displayValue(question,e))+'</span>'+(e.source?'<a class="tiny" href="'+esc(e.source)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+'</div>').join(''))}
function dispatch(a,el){sound();switch(a){case'intro':intro();break;case'intro-end':showHome();break;case'home':if(s&&!s.demo&&s.stage!=='final')modal('<h2>Take a breather?</h2><p>Your game is saved. Returning here won’t reveal anyone’s answer.</p><div class="actions">'+button('Back to the start','confirm-home')+button('Keep playing','close','secondary')+'</div>');else showHome();break;case'confirm-home':closeModal();showHome();break;case'end-home':saved=null;try{localStorage.removeItem(KEY)}catch{}showHome();break;case'setup':setup=null;setupSet=null;error='';setupScreen();break;case'add':if(setup.length>=10)break;setup.push({name:'',help:false});setupScreen();document.querySelectorAll('[data-name]')[setup.length-1].focus();break;case'remove':setup.splice(+el.dataset.index,1);setupScreen();break;case'help-toggle':setup[+el.dataset.index].help=!setup[+el.dataset.index].help;setupScreen();break;case'start':startGame();break;case'resume':resume();break;case'change-question':if(s?.stage!=='round'||s.turn!==0||s.answers.length)break;s.deck[s.round]=(s.deck[s.round]+1)%bank[s.round].length;s.mode=current().defaultMode;s.draft='';delete s.pending;delete s.remaining;s.revealGroup=0;s.revealCount=0;s.phase=0;persist();render();break;case'round-ready':s.challengeReady=true;s.mode=question.defaultMode;s.stage='handover';persist();render();break;case'ready':s.stage='answer';persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'select-answer':selectAnswer(el.dataset.key);break;case'confirm-lock':lockAnswer({raw:confirm.raw,key:confirm.entry?.id??null});break;case'edit-answer':s.draft=confirm.raw;s.stage='answer';delete s.pending;persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'pass':modal('<h2>Leave this one?</h2><p>A pass scores zero. Sometimes discretion is the better part of trivia.</p><div class="actions">'+button('Pass — zero points','confirm-pass','danger')+button('I’ll think again','close','secondary')+'</div>');break;case'confirm-pass':closeModal();lockAnswer({raw:'Passed',key:null,passed:true});break;case'hint':hint=!hint;$('#hint-slot').innerHTML=hint?'<div class="hint">'+esc(question.hints[s.turn%question.hints.length])+'</div>':'';break;case'scope':detail();break;case'answer-bank':ranking();break;case'skip-reveal':s.revealCount=s.phase===0?1:s.players.length;s.phase=s.phase===0?1:5;persist();render();break;case'replay-reveal':s.revealCount=0;s.revealGroup=0;s.phase=0;persist();render();break;case'scores':s.stage='leaderboard';persist();render();break;case'next':if(s.round===4){s.stage='final';persist();render()}else{s.round++;s.turn=0;s.answers=[];s.mode=bank[s.round][s.deck[s.round]].defaultMode;s.challengeReady=true;s.phase=0;s.stage='round';persist();render()}break;case'play-again':setupSet=null;setup=s.players.map(p=>({name:p.name,help:p.help}));s=null;setupScreen();break;case'demo':demo();break;case'demo-finish':setup=null;setupScreen();break;case'rules':rules();break;case'settings':preferences();break;case'announcer-toggle':prefs.announcer=!prefs.announcer;write(PREF,prefs);preferences();if(prefs.announcer)robotAnnounce('System ready. Avoid the obvious.');break;case'sound-toggle':prefs.sound=!prefs.sound;write(PREF,prefs);preferences();break;case'close':closeModal();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)dispatch(el.dataset.action,el)});
document.addEventListener('input',e=>{if(e.target.matches('[data-name]'))setup[+e.target.dataset.name].name=e.target.value;if(e.target.id==='answer'&&s){s.draft=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='question-set')setupSet=+e.target.value;if(e.target.id==='setup-timer'){prefs.timer=+e.target.value;write(PREF,prefs)}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();propose($('#answer').value)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&['answer','confirm'].includes(s.stage)){s.stage='handover';persist();render()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
window.DOGame={bank,rounds,match,evaluate,norm,distance,getState:()=>s,getPrefs:()=>prefs,seekReveal:phase=>{s.phase=phase;render()},loadTestState:state=>{s=JSON.parse(JSON.stringify(state));question=current();render()},showHome};
$('.brand').innerHTML=LOGO;
showHome();
})();



</script></body></html>
