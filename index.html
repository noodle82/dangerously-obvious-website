function distance(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function match(raw,q){const n=norm(raw);if(!n)return{kind:'empty'};const candidates=q.entries.map(e=>({e,keys:[e.name,...e.aliases].map(norm)}));const exact=candidates.filter(c=>c.keys.includes(n));if(exact.length===1)return{kind:'exact',entry:exact[0].e};if(exact.length>1)return{kind:'ambiguous'};const ranked=candidates.map(c=>({entry:c.e,d:Math.min(...c.keys.map(k=>distance(n,k)))})).sort((a,b)=>a.d-b.d);const best=ranked[0],limit=n.length>8?3:n.length>4?2:1;if(best.d<=limit&&best.d/Math.max(n.length,norm(best.entry.name).length)<=.3&&(!ranked[1]||ranked[1].d>best.d))return{kind:'typo',entry:best.entry};return{kind:'unknown'}}
function evaluate(q,answers,mode){let counts={};for(const a of answers)if(a.key!==null)counts[a.key]=(counts[a.key]||0)+1;let rows=answers.map((a,i)=>{const e=q.entries.find(e=>e.id===a.key),valid=!!e,duplicate=valid&&counts[a.key]>1;return{...a,player:i,entry:e,valid,duplicate,points:valid&&!duplicate?1:0,quality:valid?(mode==='target'?Math.abs(e.value-q.target):mode==='high'?-e.value:e.value):Infinity}});const eligible=rows.filter(r=>r.valid&&!r.duplicate),best=eligible.length?Math.min(...eligible.map(r=>r.quality)):Infinity;rows.forEach(r=>{r.winner=r.valid&&!r.duplicate&&r.quality===best;if(r.winner)r.points=3});return rows}

function setupScreen(){clearTimers();setup=setup||[{name:'Mark',help:false},{name:'Alex',help:false},{name:'Sam',help:false},{name:'Jamie',help:false}];if(setupSet===null)setupSet=Number(read('dangerously-obvious-next-set')||0)%5;$('#screen').innerHTML='<div class="content"><p class="eyebrow">ASSEMBLE YOUR OVERTHINKERS</p><h1>Who’s playing?</h1><p class="muted">Names first. Questionable decisions shortly.</p><div class="panel stack" id="players">'+setup.map((p,i)=>'<div class="name-row"><span class="num">'+String(i+1).padStart(2,'0')+'</span><input aria-label="Player '+(i+1)+' name" data-name="'+i+'" value="'+esc(p.name)+'" maxlength="20" autocomplete="off"><button class="mini '+(p.help?'on':'')+'" data-action="help-toggle" data-index="'+i+'" aria-pressed="'+p.help+'">'+(p.help?'Help on ✓':'Add help')+'</button><button class="remove" aria-label="Remove player '+(i+1)+'" data-action="remove" data-index="'+i+'" '+(setup.length<=3?'disabled':'')+'>×</button></div>').join('')+'</div>'+(setup.length<10?button('+ Add a player','add','secondary'):'')+'<p class="small muted">Help gives an optional private hint. Same points. Same bragging rights.</p><div class="panel"><div class="row setting"><div><strong>Question set</strong><p>Five fresh questions per set. Try all five.</p></div><select aria-label="Question set" id="question-set" style="width:120px">'+[0,1,2,3,4].map(i=>'<option value="'+i+'" '+(setupSet===i?'selected':'')+'>Set '+(i+1)+'</option>').join('')+'</select></div><div class="row setting"><span>Answer timer</span><select aria-label="Answer timer" id="setup-timer" style="width:140px"><option value="0" '+(!prefs.timer?'selected':'')+'>Off</option><option value="30" '+(prefs.timer===30?'selected':'')+'>30 seconds</option><option value="60" '+(prefs.timer===60?'selected':'')+'>60 seconds</option></select></div></div>'+(error?'<p class="message" role="alert">'+esc(error)+'</p>':'')+'<div class="actions">'+button('Let the second-guessing begin →','start')+'</div><p class="footnote">Matches cancel. Friendships should survive.</p></div>'}
function startGame(){setup.forEach(p=>p.name=p.name.trim());if(setup.some(p=>!p.name)){error='Every player needs a name. Even the mysterious one.';setupScreen();return}if(new Set(setup.map(p=>p.name.toLowerCase())).size!==setup.length){error='Different player names, please. Save the duplicates for your answers.';setupScreen();return}error='';const set=Math.max(0,Math.min(4,Number(setupSet)||0)),deck=[set,set,set,set,set];write('dangerously-obvious-next-set',(set+1)%5);s={version:4,players:setup.map(p=>({...p,score:0})),round:0,deck,stage:'round',turn:0,answers:[],mode:bank[0][deck[0]].defaultMode,challengeReady:true,phase:0,awarded:[],history:[],demo:false};persist();render()}
function render(){clearTimers();error='';confirm=null;question=current();const stage=s.stage;const el=$('#screen');
if(stage==='round'){el.innerHTML='<div class="content round-question">'+heading()+'<p class="read-aloud"><strong>Read this aloud to everyone.</strong><span>Everyone hears the question. Answers stay secret.</span></p>'+qcard(question)+'<div class="actions">'+button('Pass to '+esc(s.players[0].name)+' →','round-ready')+'</div><button class="textbtn" data-action="scope">Question details</button><p class="footnote">A good answer is only the beginning.</p></div>';}
if(stage==='handover'){el.innerHTML='<div class="content">'+heading()+'<section class="handover"><p class="eyebrow">PASS THE PHONE</p><h1>'+esc(s.players[s.turn].name)+'</h1><p>'+esc(['Your screen. Your answer. Their problem.','No peeking. Your own thoughts are quite enough trouble.','A great answer is only great if nobody else has it.'][s.turn%3])+'</p><div class="turn-dots" style="justify-content:center">'+s.players.map((_,i)=>'<span class="'+(i<s.turn?'complete':'')+'"></span>').join('')+'</div><div class="actions">'+button('I’m '+esc(s.players[s.turn].name)+' — ready','ready')+'</div><span class="small muted">Answers stay hidden until everyone has played.</span></section></div>';}
if(stage==='answer'){answerScreen();return}
if(stage==='confirm'){confirmScreen();return}
if(stage==='reveal'){revealScreen();return}
if(stage==='leaderboard'){leaderboard(false);return}
if(stage==='final'){leaderboard(true);return}
window.scrollTo(0,0)}

function answerScreen(){hint=false;const grid=question.input==='grid';const selected=question.entries.find(e=>e.name===s.draft);const tiles=question.order==='natural'?question.entries.slice():question.entries.slice().sort((a,b)=>a.name.localeCompare(b.name,'en'));
$('#screen').innerHTML='<div class="content">'+heading()+'<div class="row"><span class="private">'+esc(s.players[s.turn].name)+' · eyes only</span><span class="timer" id="timer"></span></div>'+qcard(question)+'<form id="answer-form">'+(grid?'<fieldset class="answer-fieldset"><legend class="input-label">Make your choice</legend><p class="small muted">All the options. None of their answers.</p><div class="answer-grid '+(tiles.length>6?'months-grid':'')+'">'+tiles.map(e=>'<button type="button" class="answer-tile '+(selected?.id===e.id?'selected':'')+'" data-action="select-answer" data-key="'+e.id+'" aria-pressed="'+(selected?.id===e.id)+'"><span>'+esc(e.name)+'</span><i aria-hidden="true">✓</i></button>').join('')+'</div></fieldset><input type="hidden" id="answer" value="'+esc(s.draft||'')+'">':'<label class="input-label" for="answer">Your answer</label><input id="answer" class="answer-input" placeholder="A good answer. Ideally, yours alone." maxlength="100" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" value="'+esc(s.draft||'')+'">')+'<div id="answer-error" role="alert"></div><div class="actions answer-actions"><button type="submit" class="btn" id="grid-lock" '+(grid&&!selected?'disabled':'')+'>Lock it in →</button></div></form>'+(s.players[s.turn].help?'<button class="textbtn" data-action="hint">A little help?</button><div id="hint-slot"></div>':'')+'<div class="row"><button class="textbtn" data-action="pass">Pass this question</button><button class="textbtn" data-action="scope">Question details</button></div><p class="footnote">'+(grid?'Choose boldly. Confirm privately. Blame nobody.':'Good recall deserves an advantage. Spelling does not.')+'</p></div>';
if(prefs.timer){s.remaining=s.remaining??prefs.timer;updateTimer();tickTimer=setInterval(()=>{if(document.hidden||$('#modal').open)return;s.remaining--;updateTimer();persist();if(s.remaining<=0)lockAnswer({raw:'No answer in time',key:null,passed:true})},1000)}window.scrollTo(0,0)}
function selectAnswer(key){if(!s||s.stage!=='answer'||question.input!=='grid')return;const e=question.entries.find(e=>e.id===key);if(!e)return;s.draft=e.name;persist();$('#answer').value=e.name;document.querySelectorAll('.answer-tile').forEach(el=>{const selected=el.dataset.key===key;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected))});$('#grid-lock').disabled=false;sound()}

function updateTimer(){const t=$('#timer');if(t)t.textContent=s.remaining+'s';}
function propose(raw){if(!raw.trim()){const e=$('#answer-error');if(e)e.innerHTML='<p class="message">Pick an answer first, or choose Pass. Even a tactical retreat needs a button.</p>';return}clearInterval(tickTimer);confirm={raw:raw.trim(),...match(raw,question)};if(confirm.kind==='ambiguous'){s.stage='answer';s.draft=raw;persist();render();$('#answer').value=raw;$('#answer-error').innerHTML='<p class="message">That could mean more than one answer. Add a little detail, such as the sequel number.</p>';return}s.stage='confirm';s.pending=confirm;persist();confirmScreen()}
function confirmScreen(){clearTimers();confirm=confirm||s.pending;if(!confirm){s.stage='handover';render();return}const known=!!confirm.entry;$('#screen').innerHTML='<div class="content">'+heading()+'<p class="eyebrow">'+(confirm.kind==='typo'?'A SMALL SPELLING CHECK':'YOUR PRIVATE ANSWER')+'</p><h2>'+(confirm.kind==='typo'?'Did you mean…?':'Happy with that?')+'</h2><p class="confirm-answer">'+esc(known?confirm.entry.name:confirm.raw)+'</p><p class="muted">'+(known?'Once locked, it stays secret until the reveal.':'I couldn’t confidently match that wording. Anything outside this round’s accepted list scores zero. You can edit it, or submit it as written.')+'</p><div class="actions">'+button(known?'Yes — lock it in':'Use as written','confirm-lock')+button('Edit my answer','edit-answer','secondary')+'</div><p class="footnote">Second thoughts are part of the game.</p></div>';window.scrollTo(0,0);}
function lockAnswer(a){clearTimers();s.answers[s.turn]=a;s.turn++;s.draft='';delete s.pending;delete s.remaining;confirm=null;if(s.turn===s.players.length){s.stage='reveal';s.phase=0}else s.stage='handover';persist();sound();render()}
function displayValue(q,e){if(q.unit==='people')return e.value.toLocaleString('en')+' people';if(q.unit==='km2')return e.value.toLocaleString('en')+' km²';if(q.unit==='latitude')return Math.abs(e.value).toFixed(2)+'° '+(e.value<0?'S':'N');if(q.unit==='size-rank')return ordinal(e.value)+' largest';if(q.unit==='hours')return e.value.toLocaleString('en')+' hours';if(q.unit==='atomic')return 'Atomic no. '+e.value;if(q.unit==='pokedex')return '#'+String(e.value).padStart(3,'0');if(q.unit==='number')return String(e.value);if(q.unit==='occurrences')return e.value.toLocaleString('en')+' uses';if(q.unit==='kg')return e.value+' kg';if(q.unit==='density')return e.value.toLocaleString('en')+' kg/m³';if(q.unit==='points')return e.value+' tile points';if(q.unit==='mm')return e.value+' mm';if(q.unit==='letters')return e.value+' letters';if(q.unit==='month')return ordinal(e.value)+' month';if(q.unit==='minutes')return e.value+' min';if(q.unit==='metres')return e.value.toLocaleString('en')+' m';if(q.unit==='year')return String(e.value);if(q.unit==='alphabet')return ordinal(e.value)+' A–Z';if(q.unit==='orbit')return ordinal(e.value)+' orbit';return ordinal(e.value)+' position'}
function getRows(){return evaluate(question,s.answers,s.mode)}
function award(){const id=s.round;if(s.awarded.includes(id))return;const rows=getRows();rows.forEach(r=>s.players[r.player].score+=r.points);s.awarded.push(id);s.history.push({round:id,question:question.id,mode:s.mode,answers:JSON.parse(JSON.stringify(s.answers)),points:rows.map(r=>r.points)});justAwarded=true;persist()}

function matchGroups(){return [...new Set(getRows().filter(r=>r.duplicate).sort((a,b)=>a.quality-b.quality||a.player-b.player).map(r=>r.key))]}
function activeMatch(){return matchGroups()[s.revealGroup||0]}
function advanceReveal(){const phase=s.phase||0;if(phase===2){s.revealGroup=0;s.phase=matchGroups().length?3:4}else if(phase===3)s.phase=3.5;else if(phase===3.5){s.revealGroup=(s.revealGroup||0)+1;s.phase=s.revealGroup<matchGroups().length?3:4}else s.phase=phase+1;persist();render()}
function revealScreen(){
const oldPositions=new Map([...document.querySelectorAll('.answer-card')].map(el=>[el.dataset.player,el.getBoundingClientRect()]));
const phase=s.phase||0;if(phase===0)window.scrollTo(0,0);if(phase>=5)award();
const all=getRows(),groups=matchGroups(),groupIndex=s.revealGroup||0,key=groups[groupIndex],active=all.filter(r=>r.duplicate&&r.key===key),resolved=groups.slice(0,groupIndex);
let rows=all.slice();if(phase>=2)rows.sort((a,b)=>a.quality-b.quality||a.player-b.player);
if(phase>=3&&phase<4)rows=rows.filter(r=>!resolved.includes(r.key));
if(phase>=4)rows=rows.filter(r=>r.valid&&!r.duplicate);
const winners=all.filter(r=>r.winner),names=winners.map(r=>s.players[r.player].name),label=active[0]?.entry.name||'Those answers';
const title=phase===0?'Phones down. Suspicions up.':phase===1?'Answers, please.':phase===2?'Let’s see how they stack up.':phase===3?label+' looks popular.':phase===3.5?label+'. Gone.':phase===4?'A little breathing room.':names.length?names.join(' & ')+(names.length>1?' share the bonus.':' takes the bonus.'):'A spectacular group effort. Zero points.';
const subtitle=phase>=5?(names.length?'An excellent answer. An even better escape.':'Everyone matched or missed. Onwards, suspiciously.'):phase===3?active.length+' matching answers. Great minds. Terrible timing.':phase===3.5?'Same answer. Same fate.':phase===2?'Strongest first. Don’t celebrate just yet.':question.metric;
$('#screen').innerHTML='<div class="content reveal-content phase-'+phase+'">'+heading()+'<p class="eyebrow">THE REVEAL'+(s.demo?' · DEMONSTRATION':'')+(phase>=3&&phase<4?' · MATCH '+(groupIndex+1)+' OF '+groups.length:'')+'</p><h2 id="reveal-title">'+esc(title)+'</h2><p class="small muted">'+esc(subtitle)+'</p><div class="board '+((s.players.length>=6&&phase<4)||rows.length>=6?'dense':'')+'">'+rows.map(r=>card(r,phase)).join('')+'</div>'+(phase>=4?'<div class="eliminated">'+all.filter(r=>!r.valid||r.duplicate).map(r=>esc(s.players[r.player].name)+' · '+esc(r.entry?.name||r.raw)+' · '+(r.duplicate?'matched':'not in this answer set')+' · 0').join('<br>')+'</div>':'')+(phase>=5?'<div class="actions">'+button(s.demo?'Try it with your friends →':'See the scores →',s.demo?'demo-finish':'scores')+button('Replay the reveal','replay-reveal','secondary')+'</div><div class="row"><button class="textbtn" data-action="answer-bank">See the answer ranking</button><button class="textbtn" data-action="scope">Question details</button></div>':'<div class="actions">'+button(phase===0?'Reveal answers →':'Show result →','skip-reveal','secondary')+'</div>')+'</div>';
if(!reduce)document.querySelectorAll('.answer-card').forEach(el=>{const before=oldPositions.get(el.dataset.player);if(before&&el.animate){const after=el.getBoundingClientRect(),dy=before.top-after.top,dx=(before.left||0)-(after.left||0);if(Math.abs(dy)>2||Math.abs(dx)>2)el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'translate(0,0)'}],{duration:1200,easing:'cubic-bezier(.22,.7,.2,1)'});}});
if(phase===3||phase===3.5)$('#announce').textContent=title+' '+subtitle;
if(phase>=5){$('#announce').textContent=title;if(justAwarded){sound(winners.length?'win':'cancel');if(prefs.sound&&'speechSynthesis'in window){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(title);u.rate=1.05;speechSynthesis.speak(u)}catch{}}justAwarded=false}}
else if(phase>0){const serial=viewSerial;revealTimer=setTimeout(()=>{if(serial!==viewSerial)return;advanceReveal()},reduce?180:({1:2500,2:3100,3:2400,3.5:1450,4:1800}[phase]));if(phase===3.5&&active.length)sound('cancel')}
}
function card(r,p){const groups=matchGroups(),group=groups.indexOf(r.key)+1,count=getRows().filter(x=>x.valid&&x.key===r.key).length,active=r.duplicate&&r.key===activeMatch(),matchPhase=(p===3||p===3.5)&&active;
const core='<div class="card-core"><div><div class="player">'+esc(s.players[r.player].name)+'</div><div class="answer">'+(p===0?'••••••':esc(r.entry?.name||r.raw))+'</div>'+(p>=3&&p<4&&active?'<span class="chip">'+count+' MATCHING · '+(p===3?'DANGER':'CANCELLED')+'</span>':p>=2&&!r.valid?'<span class="chip">'+(r.passed?'PASSED':'NOT IN THIS ANSWER SET')+'</span>':p>=5?'<span class="chip good">'+(r.winner?'BEST SURVIVOR':'UNMATCHED')+'</span>':'')+'</div><div>'+(p>=2&&r.valid?'<div class="value">'+esc(displayValue(question,r.entry))+'</div>':'')+(p>=5?'<div class="points">+'+r.points+'</div>':'')+'</div></div>';
const shards=p===3.5&&active?'<div class="shard-field" aria-hidden="true">'+Array.from({length:12},(_,i)=>{const col=i%4,row=Math.floor(i/4);return '<div class="card-shard" style="clip-path:inset('+row*33.333+'% '+(3-col)*25+'% '+(2-row)*33.333+'% '+col*25+'%);--sx:'+((col-1.5)*70)+'px;--sy:'+((row-1)*90-15)+'px;--rot:'+((i%2?1:-1)*(12+i*5))+'deg;animation-delay:'+(i%3)*.025+'s">'+core+'</div>'}).join('')+'</div>':'';
return '<article class="answer-card '+(matchPhase?'matched ':'')+(p===3.5&&active?'destroying ':'')+(p>=5&&r.winner?'winner ':'')+(p>=2&&!r.valid?'invalid':'')+'" data-player="'+r.player+'" '+(matchPhase?'data-match-group="'+group+'"':'')+'>'+core+shards+'</article>'}
function leaderboard(final){const rows=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.i-b.i),best=rows[0].score,winners=rows.filter(p=>p.score===best),history=s.history.find(h=>h.round===s.round);$('#screen').innerHTML='<div class="content">'+(final?'<section class="champion"><div class="crown" aria-hidden="true">✦</div><p class="eyebrow">'+(winners.length>1?'SHARED BRAGGING RIGHTS':'THE FINAL WORD')+'</p><h1>'+winners.map(p=>esc(p.name)).join(' & ')+'</h1><p class="lede" style="margin:0 auto">'+(winners.length>1?'A tie. Apparently you can agree on something.':'Officially difficult to second-guess.')+'</p></section>':heading()+'<p class="eyebrow">ROUND '+(s.round+1)+' SCORED</p><h1>The plot thickens.</h1><p class="muted">Your friends are learning how you think. Inconvenient.</p>')+'<div class="panel">'+rows.map((p,i)=>'<div class="standing"><span class="num">'+String(i+1).padStart(2,'0')+'</span><strong>'+esc(p.name)+'</strong><span class="gain">'+(!final&&history?'+'+history.points[p.i]:'')+'</span><b>'+p.score+'</b></div>').join('')+'</div><div class="actions">'+button(final?'Same friends. Fresh suspicions. →':s.round===4?'Crown the winner →':'Next round →',final?'play-again':'next')+(final?button('Back to the start','end-home','secondary'):'')+'</div><p class="footnote">'+(final?'Great minds think apart.':'Unique +1 · Best survivor 3 total · Matches 0')+'</p></div>';if(final)persist();window.scrollTo(0,0);}
function resume(){s=JSON.parse(JSON.stringify(saved));if(!s||!Array.isArray(s.players)||s.round<0||s.round>4||!Array.isArray(s.deck)||s.deck.length!==5||s.deck.some(v=>!Number.isInteger(v)||v<0||v>=5)||s.players.length<3||s.players.length>10||!Array.isArray(s.answers)||!Array.isArray(s.awarded)||!Array.isArray(s.history)||s.version!==4){saved=null;showHome();return}if(['answer','confirm'].includes(s.stage))s.stage='handover';if(s.stage==='reveal'){s.phase=0;s.revealGroup=0;}if(!['high','low','target','choice'].includes(s.mode))s.mode=current().defaultMode;persist();render()}
function demo(){const q=bank[0][0],ranked=q.entries.slice().sort((a,b)=>q.defaultMode==='low'?a.value-b.value:b.value-a.value);s={version:4,players:['Alex','Sam','Jamie','Taylor','You'].map(name=>({name,help:false,score:0})),round:0,deck:[0,0,0,0,0],stage:'reveal',turn:5,answers:[ranked[0],ranked[0],ranked[1],ranked[1],ranked[2]].map(e=>({raw:e.name,key:e.id})),mode:q.defaultMode,challengeReady:true,phase:0,revealGroup:0,awarded:[],history:[],demo:true};question=current();render()}
function preferences(){modal('<p class="eyebrow">KEEP IT YOUR WAY</p><h2>Settings</h2><div class="setting row"><div><strong>Sound & winner announcement</strong><p>Short effects. No surprise soundtrack.</p></div><button class="toggle '+(prefs.sound?'on':'')+'" data-action="sound-toggle">'+(prefs.sound?'On':'Off')+'</button></div><p class="small muted">The optional answer timer is chosen before a new game. Your preferences are remembered on this device.</p><p class="small muted">Answers and scores stay on this device. No account needed.</p>'+button('Play the opening sting','intro','secondary'))}
function rules(){modal('<p class="eyebrow">THE SHORT VERSION</p><h2>Know the answer.<br>Read the room.</h2><p>Everyone names one answer that fits the question. The challenge tells you which answer is strongest.</p><div class="panel score-rules"><div><strong>1</strong><span>Valid & unique</span></div><div><strong>3</strong><span>Best survivor</span></div><div><strong>0</strong><span>Match or invalid</span></div></div><p>Matching answers cancel—even with different spellings. Different answers with the same value stay in; tied best survivors each get 3.</p><p>If no answers survive, nobody scores. Over five rounds, most points wins. Tied champions share the glory.</p><p class="small muted">Each game has five rounds. Five question sets provide 25 candidates to try. Familiar small answer sets use a grid; recall questions keep their answers hidden. Every challenge is fixed—no spinner.</p>')}
function detail(){modal('<p class="eyebrow">THE SMALL PRINT, MERCIFULLY SMALL</p><h2>'+esc(question.subject)+'</h2><p>'+esc(question.scope)+'</p><p class="small muted">'+question.entries.length+' accepted answers. Aliases refer to the same answer. A recognised spelling correction is confirmed privately; rank stays hidden.</p>'+(question.source&&(['leaderboard','final'].includes(s.stage)||(s.stage==='reveal'&&s.phase>=5))?'<a href="'+esc(question.source)+'" target="_blank" rel="noopener noreferrer">Question source ↗</a>':'<p class="small muted">Sources and the full answer ranking appear after the reveal.</p>'))}
function ranking(){const entries=question.entries.slice().sort((a,b)=>(s.mode==='target'?Math.abs(a.value-question.target)-Math.abs(b.value-question.target):s.mode==='high'?b.value-a.value:a.value-b.value)||a.name.localeCompare(b.name));modal('<p class="eyebrow">THE FULL PICTURE</p><h2>Answer ranking</h2><p class="small muted">Strongest first for this challenge. Matching answers were cancelled before awarding the bonus.</p>'+entries.map(e=>'<div class="setting row"><strong>'+esc(e.name)+'</strong><span class="small muted">'+esc(displayValue(question,e))+'</span>'+(e.source?'<a class="tiny" href="'+esc(e.source)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+'</div>').join(''))}
function dispatch(a,el){sound();switch(a){case'intro':intro();break;case'intro-end':showHome();break;case'home':if(s&&!s.demo&&s.stage!=='final')modal('<h2>Take a breather?</h2><p>Your game is saved. Returning here won’t reveal anyone’s answer.</p><div class="actions">'+button('Back to the start','confirm-home')+button('Keep playing','close','secondary')+'</div>');else showHome();break;case'confirm-home':closeModal();showHome();break;case'end-home':saved=null;try{localStorage.removeItem(KEY)}catch{}showHome();break;case'setup':setup=null;setupSet=null;error='';setupScreen();break;case'add':if(setup.length>=10)break;setup.push({name:'',help:false});setupScreen();document.querySelectorAll('[data-name]')[setup.length-1].focus();break;case'remove':setup.splice(+el.dataset.index,1);setupScreen();break;case'help-toggle':setup[+el.dataset.index].help=!setup[+el.dataset.index].help;setupScreen();break;case'start':startGame();break;case'resume':resume();break;case'round-ready':s.challengeReady=true;s.mode=question.defaultMode;s.stage='handover';persist();render();break;case'ready':s.stage='answer';persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'select-answer':selectAnswer(el.dataset.key);break;case'confirm-lock':lockAnswer({raw:confirm.raw,key:confirm.entry?.id??null});break;case'edit-answer':s.draft=confirm.raw;s.stage='answer';delete s.pending;persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'pass':modal('<h2>Leave this one?</h2><p>A pass scores zero. Sometimes discretion is the better part of trivia.</p><div class="actions">'+button('Pass — zero points','confirm-pass','danger')+button('I’ll think again','close','secondary')+'</div>');break;case'confirm-pass':closeModal();lockAnswer({raw:'Passed',key:null,passed:true});break;case'hint':hint=!hint;$('#hint-slot').innerHTML=hint?'<div class="hint">'+esc(question.hints[s.turn%question.hints.length])+'</div>':'';break;case'scope':detail();break;case'answer-bank':ranking();break;case'skip-reveal':s.phase=s.phase===0?1:5;persist();render();break;case'replay-reveal':s.revealGroup=0;s.phase=0;persist();render();break;case'scores':s.stage='leaderboard';persist();render();break;case'next':if(s.round===4){s.stage='final';persist();render()}else{s.round++;s.turn=0;s.answers=[];s.mode=bank[s.round][s.deck[s.round]].defaultMode;s.challengeReady=true;s.phase=0;s.stage='round';persist();render()}break;case'play-again':setupSet=null;setup=s.players.map(p=>({name:p.name,help:p.help}));s=null;setupScreen();break;case'demo':demo();break;case'demo-finish':setup=null;setupScreen();break;case'rules':rules();break;case'settings':preferences();break;case'sound-toggle':prefs.sound=!prefs.sound;write(PREF,prefs);preferences();break;case'close':closeModal();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)dispatch(el.dataset.action,el)});
document.addEventListener('input',e=>{if(e.target.matches('[data-name]'))setup[+e.target.dataset.name].name=e.target.value;if(e.target.id==='answer'&&s){s.draft=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='question-set')setupSet=+e.target.value;if(e.target.id==='setup-timer'){prefs.timer=+e.target.value;write(PREF,prefs)}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();propose($('#answer').value)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&['answer','confirm'].includes(s.stage)){s.stage='handover';persist();render()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
window.DOGame={bank,rounds,match,evaluate,norm,distance,getState:()=>s,getPrefs:()=>prefs,seekReveal:phase=>{s.phase=phase;render()},loadTestState:state=>{s=JSON.parse(JSON.stringify(state));question=current();render()},showHome};
$('.brand').innerHTML=LOGO;
showHome();
})();

</script></body></html>
