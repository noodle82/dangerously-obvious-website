. A planet with a very long day is a useful choice. The rocky planets can spin surprisingly slowly.","Being big does not mean spinning slowly: Jupiter spins in less than half an Earth day. Look at the smaller rocky worlds too.","Think of Mercury and Venus as well as Earth and Mars. The winner takes longest to turn once; distance from the Sun does not decide it."],"low":"Lowest value wins.","high":"The slowest to spin once wins.","target":0,"targetText":"","safeScope":"The eight planets. Compare the duration of one axial rotation relative to the stars, not an orbit or the interval between sunrises. A retrograde direction does not make the duration negative."}],[{"id":"summer-hosts","subject":"Olympic credentials","prompt":"Name a country that has hosted the Summer Olympics.","goal":"The earliest first hosting wins.","scope":"Modern Summer Games from 1896 through Paris 2024. Only Games actually held count. The Soviet Union is one historical answer. Germany includes the former West Germany. Countries hosting individual equestrian/sailing events count; none changes a first-hosting year.","metric":"First Summer Olympic hosting year","unit":"year","entries":[{"id":"0","name":"Greece","value":1896,"aliases":[]},{"id":"1","name":"France","value":1900,"aliases":[]},{"id":"2","name":"United States","value":1904,"aliases":["usa","us","america"]},{"id":"3","name":"United Kingdom","value":1908,"aliases":["uk","great britain","england","britain"]},{"id":"4","name":"Sweden","value":1912,"aliases":[]},{"id":"5","name":"Belgium","value":1920,"aliases":[]},{"id":"6","name":"Netherlands","value":1928,"aliases":["holland"]},{"id":"7","name":"Germany","value":1936,"aliases":["west germany"]},{"id":"8","name":"Finland","value":1952,"aliases":[]},{"id":"9","name":"Australia","value":1956,"aliases":[]},{"id":"10","name":"Italy","value":1960,"aliases":[]},{"id":"11","name":"Japan","value":1964,"aliases":[]},{"id":"12","name":"Mexico","value":1968,"aliases":[]},{"id":"13","name":"Canada","va te."],"low":"Lowest value wins.","high":"The most recent first title wins.","target":0,"targetText":"","safeScope":"FIFA women’s football World Cups from 1991 through 2023. Compare the first title for each winning country, not its latest win or its number of trophies."},{"id":"land-club","subject":"Land of opportunity","prompt":"Choose a country whose short English name ends in “land”.","goal":"The most populous wins.","scope":"The seven UN member countries ending with the exact letters land in their common short English names. Netherlands and Marshall Islands end differently. World Bank population totals, 2023.","metric":"Population in 2023","unit":"people","entries":[{"id":"0","name":"Finland","value":5583911,"aliases":[]},{"id":"1","name":"Iceland","value":385663,"aliases":[]},{"id":"2","name":"Ireland","value":5311538,"aliases":[]},{"id":"3","name":"New Zealand","value":5200000,"aliases":[]},{"id":"4","name":"Poland","value":36687353,"aliases":[]},{"id":"5","name":"Switzerland","value":8888822,"aliases":[]},{"id":"6","name":"Thailand","value":71702435,"aliases":[]}],"defaultMode":"high","input":"grid","boundary":"Exact ending “land” · Population in 2023","source":"https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?date=2023&format=json","hints":["Thailand is in Asia; Poland is in Europe. Both end in land and count. Compare how many people live there, rather than their size on a map.","Finland and Iceland both count. New Zealand does too. It is a country’s population that matters, not how many people you know from there.","Ireland and Switzerland are valid. England is part of the United Kingdom, so it does not count as a separate UN country here."],"low":"Lowest value wins.","high":"The most populous wins.","target":0,"targetText":"","safeScope":"The seven UN member countries whose familiar short English names end with the exact letters specified in the question. Compare World Bank population totals for 2023."}]];

const norm=x=>String(x).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/^harry potter\s*(and\s*)?(the\s*)?/,'').replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
function distance(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function match(raw,q){const n=norm(raw);if(!n)return{kind:'empty'};const candidates=q.entries.map(e=>({e,keys:[e.name,...e.aliases].map(norm)}));const exact=candidates.filter(c=>c.keys.includes(n));if(exact.length===1)return{kind:'exact',entry:exact[0].e};if(exact.length>1)return{kind:'ambiguous'};const ranked=candidates.map(c=>({entry:c.e,d:Math.min(...c.keys.map(k=>distance(n,k)))})).sort((a,b)=>a.d-b.d);const best=ranked[0],limit=n.length>8?3:n.length>4?2:1;if(best.d<=limit&&best.d/Math.max(n.length,norm(best.entry.name).length)<=.3&&(!ranked[1]||ranked[1].d>best.d))return{kind:'typo',entry:best.entry};return{kind:'unknown'}}

if(phase>=3)$('#announce').textContent=title+' '+subtitle;
if(phase>=5){if(justAwarded){sound(winners.length?'win':'cancel');if(prefs.announcer)robotAnnounce(names.length?(definite?'Matching team detected. ':'Survivor detected. ')+names.join('. And ')+(definite?'. Three points each.':'. Three points.'):'No scoring answers. Zero points.');justAwarded=false}}
else if(phase>0){const serial=viewSerial;revealTimer=setTimeout(()=>{if(serial!==viewSerial)return;advanceReveal()},phase===1?1100:reduce?180:({2:3100,3:2400,3.25:1100,3.5:1450,4:definite?2400:1800,4.25:1450,4.5:1800}[phase]));if(phase===3.5&&active.length)sound(definite?'win':'cancel');if(definite&&phase===4.25&&eliminated.length)sound('cancel')}
}
function card(r,p){const definite=isDefinite(),groups=matchGroups(),group=groups.indexOf(r.key)+1,count=getRows().filter(x=>x.valid&&x.key===r.key).length,active=!r.fused&&r.duplicate&&r.key===activeMatch(),matchPhase=(p===3||p===3.25||p===3.5)&&active,threat=definite&&!r.eligible&&(p===4||p===4.25),destroy=definite?p===4.25&&!r.eligible:p===3.5&&active;
const hidden=p===0||(p===1&&r.player>=(s.revealCount||1)),player=r.fused?r.members.map(x=>s.players[x.player].name).join(' + '):s.players[r.player].name;
let chip='';if(r.fused)chip=p>=5?(r.winner?'BEST MATCH':'MATCHED')+' · '+r.members.length+' PLAYERS':r.members.length+' MATCHING · SAFE';else if(p>=3&&p<4&&active)chip=count+' MATCHING · '+(definite?(p===3?'FOUND':p===3.25?'COMING TOGETHER':'SAFE'):(p===3?'DANGER':p===3.25?'COLLISION':'CANCELLED'));else if(p>=2&&!r.valid)chip=r.passed?'NO ANSWER':'NOT IN THIS ANSWER SET';else if(threat)chip=p===4?'UNMATCHED · DANGER':'UNMATCHED · CANCELLED';else if(p>=5)chip=r.winner?'BEST SURVIVOR':'UNMATCHED';

const shards=destroy?'<div class="shard-field" aria-hidden="true">'+Array.from({length:12},(_,i)=>{const col=i%4,row=Math.floor(i/4);return '<div class="card-shard" style="clip-path:inset('+row*33.333+'% '+(3-col)*25+'% '+(2-row)*33.333+'% '+col*25+'%);--sx:'+((col-1.5)*70)+'px;--sy:'+((row-1)*90-15)+'px;--rot:'+((i%2?1:-1)*(12+i*5))+'deg;animation-delay:'+(i%3)*.025+'s">'+core+'</div>'}).join('')+'</div>':'';

const cx=cards.reduce((n,el)=>n+el.offsetLeft+el.offsetWidth/2,0)/cards.length,cy=cards.reduce((n,el)=>n+el.offsetTop+el.offsetHeight/2,0)/cards.length;
const fused=$('#fusion-card');if(fused){const first=cards[0];fused.style.width=first.offsetWidth+'px';fused.style.left=(cx-first.offsetWidth/2)+'px';fused.style.top=(cy-fused.offsetHeight/2)+'px'}
cards.forEach(el=>{el.style.setProperty('--cx',(cx-el.offsetLeft-el.offsetWidth/2)+'px');el.style.setProperty('--cy',(cy-el.offsetTop-el.offsetHeight/2)+'px')});
}

function victorySound(){if(!prefs.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const now=audioCtx.currentTime;[220,330,440,554.37,659.25,880].forEach((hz,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=now+.12*i;o.type='triangle';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.04,t+.035);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.7)})}catch{}}
function leaderboard(final){const rows=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.i-b.i),best=rows[0].score,winners=rows.filter(p=>p.score===best),history=s.history.find(h=>h.round===s.round);$('#screen').innerHTML='<div class="content '+(final?'finale':'')+'">'+(final?victoryConfetti()+'<section class="champion"><div class="victory-light" aria-hidden="true"></div><div class="victory-mark" aria-hidden="true">!</div><p class="final-build">Suspicion confirmed.</p><p class="eyebrow">'+(winners.length>1?'SHARED BRAGGING RIGHTS':isDefinite()?'GREAT MINDS CONFIRMED':'THE LAST MIND STANDING')+'</p><h1>'+winners.map(p=>esc(p.name)).join(' & ')+'</h1><p class="champion-score">'+best+'<span>points of glorious overthinking</span></p><p class="lede" style="margin:0 auto">'+(winners.length>1?'A tie. Apparently you can agree on something.':isDefinite()?'Officially in excellent company.':'Officially difficult to second-guess.')+'</p></section>':heading()+'<p class="eyebrow">ROUND '+(s.round+1)+' SCORED</p><h1>The plot thickens.</h1><p class="muted">Your friends are learning how you think. Inconvenient.</p>')+'<div class="panel">'+rows.map((p,i)=>'<div class="standing"><span class="num">'+String(i+1).padStart(2,'0')+'</span><strong>'+esc(p.name)+'</strong><span class="gain">'+(!final&&history?'+'+history.points[p.i]:'')+'</span><b>'+p.score+'</b></div>').join('')+'</div><div class="actions">'+button(final?'Same friends. Fresh suspicions. →':s.round===4?'Crown the winner →':'Next round →',final?'play-again':'next')+(final?button('Back to the start','end-home','secondary'):'')+'</div><p class="footnote">'+(final?modeInfo().tagline:isDefinite()?'Matching +1 · Best match 3 each · Alone 0':'Unique +1 · Best survivor 3 total · Matches 0')+'</p></div>';if(final){persist();$('#announce').textContent='Game complete. '+winners.map(p=>p.name).join(' and ')+(winners.length>1?' win together':' wins')+' with '+best+' points.';const serial=viewSerial;revealTimer=setTimeout(() function resume(){s=JSON.parse(JSON.stringify(saved));if(!s||!Array.isArray(s.players)||s.round<0||s.round>4||!Array.isArray(s.deck)||s.deck.length!==5||s.deck.some(v=>!Number.isInteger(v)||v<0||v>=5)||s.players.length<3||s.players.length>10||!Array.isArray(s.answers)||!Array.isArray(s.awarded)||!Array.isArray(s.history)||s.version!==7){saved=null;showHome();return}if(!['danger','definite'].includes(s.gameMode))s.gameMode='danger';selectedMode=s.gameMode;write('deviously-obvious-mode',selectedMode);if(['answer','confirm'].includes(s.stage))s.stage='handover';if(s.stage==='reveal'){s.phase=0;s.revealGroup=0;}if(!['high','low','target','choice'].includes(s.mode))s.mode=current().defaultMode;persist();render()}
function demo(){const q=bank[0][0],ranked=q.entries.slice().sort((a,b)=>q.defaultMode==='low'?a.value-b.value:b.value-a.value);s={version:7,gameMode:selectedMode,players:['Alex','Sam','Jamie','Taylor','You'].map(name=>({name,help:false,score:0})),round:0,deck:[0,0,0,0,0],stage:'reveal',turn:5,answers:[ranked[0],ranked[0],ranked[1],ranked[1],ranked[2]].map(e=>({raw:e.name,key:e.id})),mode:q.defaultMode,challengeReady:true,phase:0,revealGroup:0,awarded:[],history:[],demo:true};question=current();render()}
function robotAnnounce(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),voices=speechSynthesis.getVoices(),english=voices.filter(v=>/^en/i.test(v.lang));u.voice=english.find(v=>/robot|synthe|computer|compact/i.test(v.name))||english[0]||null;u.pitch=.25;u.rate=.9;u.volume=.85;speechSynthesis.speak(u)}catch{}}
function preferences(){modal('<p class="eyebrow">KEEP IT YOUR WAY</p><h2>Settings</h2><div class="setting row"><div><strong>Sound effects</strong><p>Short effects. No surprise soundtrack.</p></div><button class="toggle '+(prefs.sound?'on':'')+'" data-action="sound-toggle">'+(prefs.sound?'On':'Off')+'</button></div><div class="setting row"><div><strong>Robot announcer</strong><p>Short, low-pitched spoken results.</p></div><button class="toggle '+(prefs.announcer?'on':'')+'" data-action="announcer-toggle">'+(prefs.announcer?'On':'Off')+'</button></div><p class="small muted">The optional answer timer is chosen before a new game. Your preferences are remembered on this device.</p><p class="small muted">Answers and scores stay on this device. No account needed.</p>'+button('Play the opening sting','intro','secondary'))}

function detail(){const finished=['leaderboard','final'].includes(s.stage)||(s.stage==='reveal'&&s.phase>=5);modal('<p class="eyebrow">THE SMALL PRINT, MERCIFULLY SMALL</p><h2>'+esc(question.subject)+'</h2><p>'+esc(finished?question.scope:question.safeScope)+'</p><p class="small muted">'+question.entries.length+' possible answers. A recognised spelling correction is confirmed privately; rank stays hidden until the reveal.</p>'+(finished&&question.source?'<a href="'+esc(question.source)+'" target="_blank" rel="noopener noreferrer">Question source ↗</a>':'<p class="small muted">The reference and full answer ranking are available after the reveal.</p>'))}

function dispatch(a,el){sound();switch(a){case'set-mode':if(!['home','setup'].includes(uiView))break;if(!['danger','definite'].includes(el.dataset.gameMode))break;selectedMode=el.dataset.gameMode;write('deviously-obvious-mode',selectedMode);if(uiView==='setup')setupScreen();else showHome();break;case'intro':intro();break;case'intro-end':showHome();break;case'home':if(s&&!s.demo&&s.stage!=='final')modal('<h2>Take a breather?</h2><p>Your game is saved. Returning here won’t reveal anyone’s answer.</p><div class="actions">'+button('Back to the start','confirm-home')+button('Keep playing','close','secondary')+'</div>');else showHome();break;case'confirm-home':closeModal();showHome();break;case'end-home':saved=null;try{localStorage.removeItem(KEY);localStorage.removeItem('dangerously-obvious-playtest-v6')}catch{}showHome();break;case'setup':setup=null;setupSet=null;error='';setupScreen();break;case'add':if(setup.length>=10)break;setup.push({name:'',help:false});setupScreen();document.querySelectorAll('[data-name]')[setup.length-1].focus();break;case'remove':setup.splice(+el.dataset.index,1);setupScreen();break;case'help-toggle':setup[+el.dataset.index].help=!setup[+el.dataset.index].help;setupScreen();break;case'start':startGame();break;case'resume':resume();break;case'change-question':if(s?.stage!=='round'||s.turn!==0||s.answers.length)break;s.deck[s.round]=(s.deck[s.round]+1)%bank[s.round].length;s.mode=current().defaultMode;s.draft='';delete s.pending;delete s.remaining;s.revealGroup=0;s.revealCount=0;s.phase=0;persist();render();break;case'round-ready':s.challengeReady=true;s.mode=question.defaultMode;s.stage='handover';persist();render();break;case'ready':s.stage='answer';persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'select-answer':selectAnswer(el.dataset.key);break;case'confirm-lock':lockAnswer({raw:confirm.raw,key:confirm.entry?.id??null});break;case'edit-answer':s.draft=confirm.raw;s.stage='answer';delete s.pendi
