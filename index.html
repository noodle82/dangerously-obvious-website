function setupScreen(){clearTimers();setup=setup||[{name:'Mark',help:false},{name:'Alex',help:false},{name:'Sam',help:false},{name:'Jamie',help:false}];$('#screen').innerHTML='<div class="content"><p class="eyebrow">ASSEMBLE YOUR OVERTHINKERS</p><h1>Who’s playing?</h1><p class="muted">Names first. Questionable decisions shortly.</p><div class="panel stack" id="players">'+setup.map((p,i)=>'<div class="name-row"><span class="num">'+String(i+1).padStart(2,'0')+'</span><input aria-label="Player '+(i+1)+' name" data-name="'+i+'" value="'+esc(p.name)+'" maxlength="20" autocomplete="off"><button class="mini '+(p.help?'on':'')+'" data-action="help-toggle" data-index="'+i+'" aria-pressed="'+p.help+'">'+(p.help?'Help on ✓':'Add help')+'</button><button class="remove" aria-label="Remove player '+(i+1)+'" data-action="remove" data-index="'+i+'" '+(setup.length<=3?'disabled':'')+'>×</button></div>').join('')+'</div>'+(setup.length<10?button('+ Add a player','add','secondary'):'')+'<p class="small muted" style="margin-top:12px">Help gives an optional private hint. Same points. Same bragging rights.</p><div class="panel"><div class="row"><span>Answer timer</span><select aria-label="Answer timer" id="setup-timer" style="width:140px"><option value="0" '+(!prefs.timer?'selected':'')+'>Off</option><option value="30" '+(prefs.timer===30?'selected':'')+'>30 seconds</option><option value="60" '+(prefs.timer===60?'selected':'')+'>60 seconds</option></select></div><div class="setting row"><div><strong>Challenge wheel</strong><p>Question-specific challenges. Everyone faces the same result.</p></div><button class="toggle '+(prefs.spinner?'on':'')+'" data-action="spinner-toggle">'+(prefs.spinner?'On':'Off')+'</button></div></div>'+(error?'<p class="message" role="alert">'+esc(error)+'</p>':'')+'<div class="actions">'+button('Let the second-guessing begin →','start')+'</div><p class="footnote">Matches cancel. Friendships should survive.</p></div>'}
function startGame(){setup.forEach(p=>p.name=p.name.trim());if(setup.some(p=>!p.name)){error='Every player needs a name. Even the mysterious one.';setupScreen();return}if(new Set(setup.map(p=>p.name.toLowerCase())).size!==setup.length){error='Different player names, please. Save the duplicates for your answers.';setupScreen();return}error='';const deck=[0,0,0,0,0];s={version:2,players:setup.map(p=>({...p,score:0})),round:0,deck,stage:'round',turn:0,answers:[],mode:bank[0][0].defaultMode,challengeReady:!prefs.spinner,phase:0,awarded:[],history:[],demo:false};persist();render()}
function render(){clearTimers();error='';confirm=null;question=current();const stage=s.stage;const el=$('#screen');
if(stage==='round'){el.innerHTML='<div class="content">'+heading()+'<p class="eyebrow">'+esc(rounds[s.round][0])+'</p><h1>'+esc(rounds[s.round][1])+'</h1><p class="muted">Round '+(s.round+1)+' brings '+question.entries.length+' possible answers. Your friends bring the complications.</p>'+qcard(question,true)+'<div class="actions">'+button(prefs.spinner?'Spin the challenge →':'Pass to '+esc(s.players[0].name)+' →','round-ready')+'</div><button class="textbtn" data-action="scope">Question details</button></div>';}
if(stage==='wheel'){wheelScreen();return}
if(stage==='wheel-result'){wheelResult();return}
if(stage==='choice'){el.innerHTML='<div class="content">'+heading()+'<p class="eyebrow">PLAYER’S CHOICE</p><h1>'+esc(s.players[s.round%s.players.length].name)+', set the trap.</h1><p class="muted">Choose the challenge before anyone answers. They’ll wonder what you know.</p><div class="question"><h2>'+esc(question.subject)+'</h2><p>'+esc(question.prompt)+'</p></div><div class="choice-grid">'+['low','high','target'].map(m=>button(esc(modeText(question,m)),'choose-mode','secondary','data-mode="'+m+'"')).join('')+'</div></div>';}
if(stage==='handover'){el.innerHTML='<div class="content">'+heading()+'<section class="handover"><div class="avatar">'+esc(s.players[s.turn].name[0].toUpperCase())+'</div><p class="eyebrow">PASS THE PHONE</p><h1>'+esc(s.players[s.turn].name)+'</h1><p>'+esc(['Your screen. Your answer. Their problem.','No peeking. Your own thoughts are quite enough trouble.','A great answer is only great if nobody else has it.'][s.turn%3])+'</p><div class="turn-dots" style="justify-content:center">'+s.players.map((_,i)=>'<span class="'+(i<s.turn?'complete':'')+'"></span>').join('')+'</div><div class="actions">'+button('I’m '+esc(s.players[s.turn].name)+' — ready','ready')+'</div><span class="small muted">Answers stay hidden until everyone has played.</span></section></div>';}
if(stage==='answer'){answerScreen();return}
if(stage==='confirm'){confirmScreen();return}
if(stage==='reveal'){revealScreen();return}
if(stage==='leaderboard'){leaderboard(false);return}
if(stage==='final'){leaderboard(true);return}
window.scrollTo(0,0)}

function answerScreen(){hint=false;const grid=question.input==='grid';const selected=question.entries.find(e=>e.name===s.draft);const tiles=question.entries.slice().sort((a,b)=>a.name.localeCompare(b.name,'en'));
$('#screen').innerHTML='<div class="content">'+heading()+'<div class="row"><span class="private">'+esc(s.players[s.turn].name)+' · eyes only</span><span class="timer" id="timer"></span></div>'+qcard(question)+'<form id="answer-form">'+(grid?'<fieldset class="answer-fieldset"><legend class="input-label">Make your choice</legend><p class="small muted">All the options. None of their answers.</p><div class="answer-grid '+(tiles.length>6?'months-grid':'')+'">'+tiles.map(e=>'<button type="button" class="answer-tile '+(selected?.id===e.id?'selected':'')+'" data-action="select-answer" data-key="'+e.id+'" aria-pressed="'+(selected?.id===e.id)+'"><span>'+esc(e.name)+'</span><i aria-hidden="true">✓</i></button>').join('')+'</div></fieldset><input type="hidden" id="answer" value="'+esc(s.draft||'')+'">':'<label class="input-label" for="answer">Your answer</label><input id="answer" class="answer-input" placeholder="A good answer. Ideally, yours alone." maxlength="100" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" value="'+esc(s.draft||'')+'">')+'<div id="answer-error" role="alert"></div><div class="actions answer-actions"><button type="submit" class="btn" id="grid-lock" '+(grid&&!selected?'disabled':'')+'>Lock it in →</button></div></form>'+(s.players[s.turn].help?'<button class="textbtn" data-action="hint">A little help?</button><div id="hint-slot"></div>':'')+'<div class="row"><button class="textbtn" data-action="pass">Pass this question</button><button class="textbtn" data-action="scope">Question details</button></div><p class="footnote">'+(grid?'Choose boldly. Confirm privately. Blame nobody.':'Good recall deserves an advantage. Spelling does not.')+'</p></div>';
if(prefs.timer){s.remaining=s.remaining??prefs.timer;updateTimer();tickTimer=setInterval(()=>{if(document.hidden||$('#modal').open)return;s.remaining--;updateTimer();persist();if(s.remaining<=0)lockAnswer({raw:'No answer in time',key:null,passed:true})},1000)}window.scrollTo(0,0)}
function selectAnswer(key){if(!s||s.stage!=='answer'||question.input!=='grid')return;const e=question.entries.find(e=>e.id===key);if(!e)return;s.draft=e.name;persist();$('#answer').value=e.name;document.querySelectorAll('.answer-tile').forEach(el=>{const selected=el.dataset.key===key;el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected))});$('#grid-lock').disabled=false;sound()}

function updateTimer(){const t=$('#timer');if(t)t.textContent=s.remaining+'s';}
function propose(raw){if(!raw.trim()){const e=$('#answer-error');if(e)e.innerHTML='<p class="message">Pick an answer first, or choose Pass. Even a tactical retreat needs a button.</p>';return}clearInterval(tickTimer);confirm={raw:raw.trim(),...match(raw,question)};if(confirm.kind==='ambiguous'){s.stage='answer';s.draft=raw;persist();render();$('#answer').value=raw;$('#answer-error').innerHTML='<p class="message">That could mean more than one answer. Add a little detail, such as the sequel number.</p>';return}s.stage='confirm';s.pending=confirm;persist();confirmScreen()}
function confirmScreen(){clearTimers();confirm=confirm||s.pending;if(!confirm){s.stage='handover';render();return}const known=!!confirm.entry;$('#screen').innerHTML='<div class="content">'+heading()+'<p class="eyebrow">'+(confirm.kind==='typo'?'A SMALL SPELLING CHECK':'YOUR PRIVATE ANSWER')+'</p><h2>'+(confirm.kind==='typo'?'Did you mean…?':'Happy with that?')+'</h2><p class="confirm-answer">'+esc(known?confirm.entry.name:confirm.raw)+'</p><p class="muted">'+(known?'Once locked, it stays secret until the reveal.':'I couldn’t confidently match that wording. Anything outside this round’s accepted list scores zero. You can edit it, or submit it as written.')+'</p><div class="actions">'+button(known?'Yes — lock it in':'Use as written','confirm-lock')+button('Edit my answer','edit-answer','secondary')+'</div><p class="footnote">Second thoughts are part of the game.</p></div>';window.scrollTo(0,0);}
function lockAnswer(a){clearTimers();s.answers[s.turn]=a;s.turn++;s.draft='';delete s.pending;delete s.remaining;confirm=null;if(s.turn===s.players.length){s.stage='reveal';s.phase=0}else s.stage='handover';persist();sound();render()}
function displayValue(q,e){if(q.unit==='mm')return e.value+' mm';if(q.unit==='letters')return e.value+' letters';if(q.unit==='month')return ordinal(e.value)+' month';if(q.unit==='minutes')return e.value+' min';if(q.unit==='metres')return e.value.toLocaleString('en')+' m';if(q.unit==='year')return String(e.value);if(q.unit==='alphabet')return ordinal(e.value)+' A–Z';if(q.unit==='orbit')return ordinal(e.value)+' orbit';return ordinal(e.value)+' position'}
function getRows(){return evaluate(question,s.answers,s.mode)}
function award(){const id=s.round;if(s.awarded.includes(id))return;const rows=getRows();rows.forEach(r=>s.players[r.player].score+=r.points);s.awarded.push(id);s.history.push({round:id,question:question.id,mode:s.mode,answers:JSON.parse(JSON.stringify(s.answers)),points:rows.map(r=>r.points)});justAwarded=true;persist()}
function revealScreen(){const oldPositions=new Map([...document.querySelectorAll('.answer-card')].map(el=>[el.dataset.player,el.getBoundingClientRect()]));const phase=s.phase||0;if(phase===0)window.scrollTo(0,0);if(phase>=5)award();let rows=getRows();const full=rows.slice().sort((a,b)=>a.quality-b.quality||a.player-b.player);if(phase>=2)rows=full;if(phase>=4)rows=rows.filter(r=>r.valid&&!r.duplicate);const winners=getRows().filter(r=>r.winner),names=winners.map(r=>s.players[r.player].name);const title=phase===0?'Phones down. Suspicions up.':phase===1?'Answers, please.':phase===2?'Here’s how they stack up.':phase===3?'Great minds. Terrible timing.':phase===3.5?'That’s dangerously obvious.':phase===4?'A little breathing room.':names.length?names.join(' & ')+(names.length>1?' share the bonus.':' takes the bonus.'):'A spectacular group effort. Zero points.';
$('#screen').innerHTML='<div class="content reveal-content phase-'+phase+'">'+heading()+'<p class="eyebrow">THE REVEAL'+(s.demo?' · DEMONSTRATION':'')+'</p><h2 id="reveal-title">'+esc(title)+'</h2><p class="small muted">'+esc(phase>=5?(names.length?'An excellent answer. An even better escape.':'Everyone matched or missed. Onwards, suspiciously.'):phase===3?'Matching answers detected. All copies are going down.':phase===3.5?'Same answer. Same fate.':question.metric)+'</p><div class="board '+(rows.length>=6?'dense':'')+'">'+rows.map(r=>card(r,phase)).join('')+'</div>'+(phase>=4?'<div class="eliminated">'+getRows().filter(r=>!r.valid||r.duplicate).map(r=>esc(s.players[r.player].name)+' · '+esc(r.entry?.name||r.raw)+' · '+(r.duplicate?'matched':'not in this answer set')+' · 0').join('<br>')+'</div>':'')+(phase>=5?'<div class="actions">'+button(s.demo?'Try it with your friends →':'See the scores →',s.demo?'demo-finish':'scores')+button('Replay the reveal','replay-reveal','secondary')+'</div><div class="row"><button class="textbtn" data-action="answer-bank">See the answer ranking</button><button class="textbtn" data-action="scope">Question details</button></div>':'<div class="actions">'+button(phase===0?'Reveal answers →':'Show result →','skip-reveal','secondary')+'</div>')+'</div>';
if(!reduce)document.querySelectorAll('.answer-card').forEach(el=>{const before=oldPositions.get(el.dataset.player);if(before&&el.animate){const after=el.getBoundingClientRect(),dy=before.top-after.top,dx=(before.left||0)-(after.left||0);if(Math.abs(dy)>2||Math.abs(dx)>2)el.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'translate(0,0)'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'});}});
if(phase>=5){$('#announce').textContent=title;if(justAwarded){sound(winners.length?'win':'cancel');if(prefs.sound&&'speechSynthesis'in window){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(title);u.rate=1.05;speechSynthesis.speak(u)}catch{}}justAwarded=false}}else if(phase>0){const serial=viewSerial;revealTimer=setTimeout(()=>{if(serial!==viewSerial)return;s.phase=phase===3?3.5:phase===3.5?4:phase+1;persist();render()},reduce?180:({1:1600,2:1700,3:1600,3.5:1100,4:1000}[phase]));if(phase===3.5&&getRows().some(r=>r.duplicate))sound('cancel')}
}
function card(r,p){const duplicateIds=[...new Set(getRows().filter(x=>x.duplicate).map(x=>x.key))];const group=duplicateIds.indexOf(r.key)+1;const count=getRows().filter(x=>x.valid&&x.key===r.key).length;const matchPhase=(p===3||p===3.5)&&r.duplicate;
const core='<div class="card-core"><div><div class="player">'+esc(s.players[r.player].name)+'</div><div class="answer">'+(p===0?'••••••':esc(r.entry?.name||r.raw))+'</div>'+(p>=3&&r.duplicate?'<span class="chip">GROUP '+group+' · '+count+' MATCHING · CANCELLED</span>':p>=2&&!r.valid?'<span class="chip">'+(r.passed?'PASSED':'NOT IN THIS ANSWER SET')+'</span>':p>=5?'<span class="chip good">'+(r.winner?'BEST SURVIVOR':'UNMATCHED')+'</span>':'')+'</div><div>'+(p>=2&&r.valid?'<div class="value">'+esc(displayValue(question,r.entry))+'</div>':'')+(p>=5?'<div class="points">+'+r.points+'</div>':'')+'</div></div>';
const shards=p===3.5&&r.duplicate?'<div class="shard-field" aria-hidden="true">'+Array.from({length:12},(_,i)=>{const col=i%4,row=Math.floor(i/4);return '<div class="card-shard" style="clip-path:inset('+row*33.333+'% '+(3-col)*25+'% '+(2-row)*33.333+'% '+col*25+'%);--sx:'+((col-1.5)*70)+'px;--sy:'+((row-1)*90-15)+'px;--rot:'+((i%2?1:-1)*(12+i*5))+'deg;animation-delay:'+(i%3)*.025+'s">'+core+'</div>'}).join('')+'</div>':'';
return '<article class="answer-card '+(matchPhase?'matched ':'')+(p===3.5&&r.duplicate?'destroying ':'')+(p>=5&&r.winner?'winner ':'')+(p>=2&&!r.valid?'invalid':'')+'" data-player="'+r.player+'" '+(matchPhase?'data-match-group="'+group+'"':'')+'>'+core+shards+'</article>'}
function leaderboard(final){const rows=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.i-b.i),best=rows[0].score,winners=rows.filter(p=>p.score===best),history=s.history.find(h=>h.round===s.round);$('#screen').innerHTML='<div class="content">'+(final?'<section class="champion"><div class="crown" aria-hidden="true">✦</div><p class="eyebrow">'+(winners.length>1?'SHARED BRAGGING RIGHTS':'THE FINAL WORD')+'</p><h1>'+winners.map(p=>esc(p.name)).join(' & ')+'</h1><p class="lede" style="margin:0 auto">'+(winners.length>1?'A tie. Apparently you can agree on something.':'Officially difficult to second-guess.')+'</p></section>':heading()+'<p class="eyebrow">ROUND '+(s.round+1)+' SCORED</p><h1>The plot thickens.</h1><p class="muted">Your friends are learning how you think. Inconvenient.</p>')+'<div class="panel">'+rows.map((p,i)=>'<div class="standing"><span class="num">'+String(i+1).padStart(2,'0')+'</span><strong>'+esc(p.name)+'</strong><span class="gain">'+(!final&&history?'+'+history.points[p.i]:'')+'</span><b>'+p.score+'</b></div>').join('')+'</div><div class="actions">'+button(final?'Same friends. Fresh suspicions. →':s.round===4?'Crown the winner →':'Next round →',final?'play-again':'next')+(final?button('Back to the start','end-home','secondary'):'')+'</div><p class="footnote">'+(final?'Great minds think apart.':'Unique +1 · Best survivor 3 total · Matches 0')+'</p></div>';if(final)persist();window.scrollTo(0,0);}
function wheelScreen(){spinBusy=false;wheelAngle=0;const labels=['high','low','target','choice'];$('#screen').innerHTML='<div class="content wheel-screen">'+heading()+'<p class="eyebrow">'+esc(s.players[s.round%s.players.length].name)+' HAS THE WHEEL</p><h1>A twist of fate.<br>A change of plan.</h1><p class="muted">'+esc(question.prompt)+'</p><div class="wheel-wrap"><div class="pointer"></div><div id="wheel" class="wheel" role="img" aria-label="Challenge wheel: '+labels.map(m=>m==='choice'?'Your choice':esc(question.labels[m])).join(', ')+'">'+labels.map(m=>'<span>'+esc(m==='choice'?'YOUR CHOICE':question.labels[m])+'</span>').join('')+'</div><div class="wheel-hub" aria-hidden="true">!</div></div><p class="small muted" id="wheel-result">Swipe to spin. A tap works too. Fate is flexible.</p><div class="actions">'+button('Spin the challenge','spin')+'</div><p class="footnote">The wheel chooses the challenge, never the answer.</p></div>';const w=$('#wheel');let start=null;w.addEventListener('pointerdown',e=>{if(spinBusy)return;start={x:e.clientX,y:e.clientY,time:performance.now()};w.setPointerCapture?.(e.pointerId)});w.addEventListener('pointerup',e=>{if(start){const distance=Math.hypot(e.clientX-start.x,e.clientY-start.y);const speed=distance/Math.max(50,performance.now()-start.time);start=null;spin(speed)}});w.addEventListener('pointercancel',()=>start=null)}
function wheelResult(){$('#screen').innerHTML='<div class="content wheel-landed">'+heading()+'<p class="eyebrow">THE CHALLENGE IS SET</p><div class="landed-symbol" aria-hidden="true">'+({low:'↓',high:'↑',target:'◎'}[s.mode])+'</div><h1>'+esc(modeText(question,s.mode))+'</h1><p class="muted">'+esc(question.prompt)+'</p>'+challenge(question)+'<p class="small muted">Everyone plays this challenge. Now choose the answer nobody else will.</p><div class="actions">'+button('Pass to '+esc(s.players[0].name)+' →','wheel-continue')+'</div></div>';$('#announce').textContent=modeText(question,s.mode)}
function spin(speed=0){if(spinBusy)return;spinBusy=true;const index=rand(4),w=$('#wheel'),turns=4+Math.min(3,Math.floor(Number(speed)||0)),end=turns*360+(360-index*90-45);w.style.transition=reduce?'none':'transform 2.8s cubic-bezier(.12,.72,.08,1)';w.style.transform='rotate('+end+'deg)';wheelAngle=end;$('#wheel-result').textContent='Please direct all complaints to the wheel.';document.querySelector('[data-action="spin"]').disabled=true;const serial=viewSerial;setTimeout(()=>{if(serial!==viewSerial)return;const modes=['high','low','target','choice'];s.mode=modes[index];s.challengeReady=true;s.stage=index===3?'choice':'wheel-result';persist();sound();render()},reduce?50:2950)}
function resume(){s=JSON.parse(JSON.stringify(saved));if(!s||!Array.isArray(s.players)||s.round<0||s.round>4||!Array.isArray(s.deck)||s.deck.length!==5||s.deck.some(v=>v!==0)||s.players.length<3||s.players.length>10||!Array.isArray(s.answers)||!Array.isArray(s.awarded)||!Array.isArray(s.history)||s.version!==2){saved=null;showHome();return}if(['answer','confirm'].includes(s.stage))s.stage='handover';if(s.stage==='reveal')s.phase=0;if(!['high','low','target','choice'].includes(s.mode))s.mode=current().defaultMode;persist();render()}
function demo(){s={version:2,players:['Alex','Sam','Jamie','Taylor','You'].map(name=>({name,help:false,score:0})),round:0,deck:[0,0,0,0,0],stage:'reveal',turn:5,answers:['0','0','1','1','2'].map(key=>({raw:bank[0][0].entries.find(e=>e.id===key).name,key})),mode:'high',challengeReady:true,phase:0,awarded:[],history:[],demo:true};question=current();render()}
function preferences(){modal('<p class="eyebrow">KEEP IT YOUR WAY</p><h2>Settings</h2><div class="setting row"><div><strong>Sound & winner announcement</strong><p>Short effects. No surprise soundtrack.</p></div><button class="toggle '+(prefs.sound?'on':'')+'" data-action="sound-toggle">'+(prefs.sound?'On':'Off')+'</button></div><p class="small muted">Timer and challenge wheel are chosen before a new game. Your preferences are remembered on this device.</p><p class="small muted">Answers and scores stay on this device. No account needed.</p>'+button('Play the opening sting','intro','secondary'))}
function rules(){modal('<p class="eyebrow">THE SHORT VERSION</p><h2>Know the answer.<br>Read the room.</h2><p>Everyone names one answer that fits the question. The challenge tells you which answer is strongest.</p><div class="panel score-rules"><div><strong>1</strong><span>Valid & unique</span></div><div><strong>3</strong><span>Best survivor</span></div><div><strong>0</strong><span>Match or invalid</span></div></div><p>Matching answers cancel—even with different spellings. Different answers with the same value stay in; tied best survivors each get 3.</p><p>If no answers survive, nobody scores. Over five rounds, most points wins. Tied champions share the glory.</p><p class="small muted">The golden five is a fixed playtest set. Months and chess use a grid; knowledge questions keep answers hidden until you type yours. Every question states its boundaries.</p>')}
function detail(){modal('<p class="eyebrow">THE SMALL PRINT, MERCIFULLY SMALL</p><h2>'+esc(question.subject)+'</h2><p>'+esc(question.scope)+'</p><p class="small muted">'+question.entries.length+' accepted answers. Aliases refer to the same answer. A recognised spelling correction is confirmed privately; rank stays hidden.</p>'+(question.source&&(['leaderboard','final'].includes(s.stage)||(s.stage==='reveal'&&s.phase>=5))?'<a href="'+esc(question.source)+'" target="_blank" rel="noopener noreferrer">Question source ↗</a>':'<p class="small muted">Sources and the full answer ranking appear after the reveal.</p>'))}
function ranking(){const entries=question.entries.slice().sort((a,b)=>(s.mode==='target'?Math.abs(a.value-question.target)-Math.abs(b.value-question.target):s.mode==='high'?b.value-a.value:a.value-b.value)||a.name.localeCompare(b.name));modal('<p class="eyebrow">THE FULL PICTURE</p><h2>Answer ranking</h2><p class="small muted">Strongest first for this challenge. Matching answers were cancelled before awarding the bonus.</p>'+entries.map(e=>'<div class="setting row"><strong>'+esc(e.name)+'</strong><span class="small muted">'+esc(displayValue(question,e))+'</span>'+(e.source?'<a class="tiny" href="'+esc(e.source)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+'</div>').join(''))}
function dispatch(a,el){sound();switch(a){case'intro':intro();break;case'intro-end':showHome();break;case'home':if(s&&!s.demo&&s.stage!=='final')modal('<h2>Take a breather?</h2><p>Your game is saved. Returning here won’t reveal anyone’s answer.</p><div class="actions">'+button('Back to the start','confirm-home')+button('Keep playing','close','secondary')+'</div>');else showHome();break;case'confirm-home':closeModal();showHome();break;case'end-home':saved=null;try{localStorage.removeItem(KEY)}catch{}showHome();break;case'setup':setup=null;error='';setupScreen();break;case'add':if(setup.length>=10)break;setup.push({name:'',help:false});setupScreen();document.querySelectorAll('[data-name]')[setup.length-1].focus();break;case'remove':setup.splice(+el.dataset.index,1);setupScreen();break;case'help-toggle':setup[+el.dataset.index].help=!setup[+el.dataset.index].help;setupScreen();break;case'spinner-toggle':prefs.spinner=!prefs.spinner;write(PREF,prefs);setupScreen();break;case'start':startGame();break;case'resume':resume();break;case'round-ready':s.challengeReady=!prefs.spinner;s.mode=question.defaultMode;s.stage=prefs.spinner?'wheel':'handover';persist();render();break;case'ready':s.stage='answer';persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'choose-mode':if(!['low','high','target'].includes(el.dataset.mode))break;s.mode=el.dataset.mode;s.challengeReady=true;s.stage='wheel-result';persist();render();break;case'wheel-continue':s.stage='handover';persist();render();break;case'select-answer':selectAnswer(el.dataset.key);break;case'spin':spin();break;case'confirm-lock':lockAnswer({raw:confirm.raw,key:confirm.entry?.id??null});break;case'edit-answer':s.draft=confirm.raw;s.stage='answer';delete s.pending;persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'pass':modal('<h2>Leave this one?</h2><p>A pass scores zero. Sometimes discretion is the better part of trivia.</p><div class="actions">'+button('Pass — zero points','confirm-pass','danger')+button('I’ll think again','close','secondary')+'</div>');break;case'confirm-pass':closeModal();lockAnswer({raw:'Passed',key:null,passed:true});break;case'hint':hint=!hint;$('#hint-slot').innerHTML=hint?'<div class="hint">'+esc(question.hints[s.turn%question.hints.length])+'</div>':'';break;case'scope':detail();break;case'answer-bank':ranking();break;case'skip-reveal':s.phase=s.phase===0?1:5;persist();render();break;case'replay-reveal':s.phase=0;persist();render();break;case'scores':s.stage='leaderboard';persist();render();break;case'next':if(s.round===4){s.stage='final';persist();render()}else{s.round++;s.turn=0;s.answers=[];s.mode=bank[s.round][0].defaultMode;s.challengeReady=!prefs.spinner;s.phase=0;s.stage='round';persist();render()}break;case'play-again':setup=s.players.map(p=>({name:p.name,help:p.help}));s=null;setupScreen();break;case'demo':demo();break;case'demo-finish':setup=null;setupScreen();break;case'rules':rules();break;case'settings':preferences();break;case'sound-toggle':prefs.sound=!prefs.sound;write(PREF,prefs);preferences();break;case'close':closeModal();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)dispatch(el.dataset.action,el)});
document.addEventListener('input',e=>{if(e.target.matches('[data-name]'))setup[+e.target.dataset.name].name=e.target.value;if(e.target.id==='answer'&&s){s.draft=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='setup-timer'){prefs.timer=+e.target.value;write(PREF,prefs)}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();propose($('#answer').value)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&['answer','confirm'].includes(s.stage)){s.stage='handover';persist();render()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
window.DOGame={bank,rounds,match,evaluate,norm,distance,getState:()=>s,getPrefs:()=>prefs,seekReveal:phase=>{s.phase=phase;render()},loadTestState:state=>{s=JSON.parse(JSON.stringify(state));question=current();render()},showHome};
$('.brand').innerHTML=LOGO;
showHome();
})();

</script></body></html>
