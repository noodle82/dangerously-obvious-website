const norm=x=>String(x).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/^harry potter\s*(and\s*)?(the\s*)?/,'').replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
function distance(a,b){let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[a.length][b.length]}
function match(raw,q){const n=norm(raw);if(!n)return{kind:'empty'};const candidates=q.entries.map(e=>({e,keys:[e.name,...e.aliases].map(norm)}));const exact=candidates.filter(c=>c.keys.includes(n));if(exact.length===1)return{kind:'exact',entry:exact[0].e};if(exact.length>1)return{kind:'ambiguous'};const ranked=candidates.map(c=>({entry:c.e,d:Math.min(...c.keys.map(k=>distance(n,k)))})).sort((a,b)=>a.d-b.d);const best=ranked[0],limit=n.length>8?3:n.length>4?2:1;if(best.d<=limit&&best.d/Math.max(n.length,norm(best.entry.name).length)<=.3&&(!ranked[1]||ranked[1].d>best.d))return{kind:'typo',entry:best.entry};return{kind:'unknown'}}

return '<article class="answer-card '+(p===1&&hidden?'unrevealed ':p===1&&r.player===(s.revealCount||1)-1?'just-revealed ':'')+(matchPhase?'matched ':'')+(p===3.5&&active?'destroying ':'')+(p>=5&&r.winner?'winner ':'')+(p>=2&&!r.valid?'invalid':'')+'" data-player="'+r.player+'" '+(matchPhase?'data-match-group="'+group+'"':'')+'>'+core+shards+'</article>'}
function leaderboard(final){const rows=s.players.map((p,i)=>({...p,i})).sort((a,b)=>b.score-a.score||a.i-b.i),best=rows[0].score,winners=rows.filter(p=>p.score===best),history=s.history.find(h=>h.round===s.round);$('#screen').innerHTML='<div class="content">'+(final?'<section class="champion"><div class="crown" aria-hidden="true">✦</div><p class="eyebrow">'+(winners.length>1?'SHARED BRAGGING RIGHTS':'THE FINAL WORD')+'</p><h1>'+winners.map(p=>esc(p.name)).join(' & ')+'</h1><p class="lede" style="margin:0 auto">'+(winners.length>1?'A tie. Apparently you can agree on something.':'Officially difficult to second-guess.')+'</p></section>':heading()+'<p class="eyebrow">ROUND '+(s.round+1)+' SCORED</p><h1>The plot thickens.</h1><p class="muted">Your friends are learning how you think. Inconvenient.</p>')+'<div class="panel">'+rows.map((p,i)=>'<div class="standing"><span class="num">'+String(i+1).padStart(2,'0')+'</span><strong>'+esc(p.name)+'</strong><span class="gain">'+(!final&&history?'+'+history.points[p.i]:'')+'</span><b>'+p.score+'</b></div>').join('')+'</div><div class="actions">'+button(final?'Same friends. Fresh suspicions. →':s.round===4?'Crown the winner →':'Next round →',final?'play-again':'next')+(final?button('Back to the start','end-home','secondary'):'')+'</div><p class="footnote">'+(final?'Great minds think apart.':'Unique +1 · Best survivor 3 total · Matches 0')+'</p></div>';if(final)persist();window.scrollTo(0,0);}
function resume(){s=JSON.parse(JSON.stringify(saved));if(!s||!Array.isArray(s.players)||s.round<0||s.round>4||!Array.isArray(s.deck)||s.deck.length!==5||s.deck.some(v=>!Number.isInteger(v)||v<0||v>=5)||s.players.length<3||s.players.length>10||!Array.isArray(s.answers)||!Array.isArray(s.awarded)||!Array.isArray(s.history)||s.version!==5){saved=null;showHome();return}if(['answer','confirm'].includes(s.stage))s.stage='handover';if(s.stage==='reveal'){s.phase=0;s.revealGroup=0;}if(!['high','low','target','choice'].includes(s.mode))s.mode=current().defaultMode;persist();render()}
function demo(){const q=bank[0][0],ranked=q.entries.slice().sort((a,b)=>q.defaultMode==='low'?a.value-b.value:b.value-a.value);s={version:5,players:['Alex','Sam','Jamie','Taylor','You'].map(name=>({name,help:false,score:0})),round:0,deck:[0,0,0,0,0],stage:'reveal',turn:5,answers:[ranked[0],ranked[0],ranked[1],ranked[1],ranked[2]].map(e=>({raw:e.name,key:e.id})),mode:q.defaultMode,challengeReady:true,phase:0,revealGroup:0,awarded:[],history:[],demo:true};question=current();render()}
function robotAnnounce(text){if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text),voices=speechSynthesis.getVoices(),english=voices.filter(v=>/^en/i.test(v.lang));u.voice=english.find(v=>/robot|synthe|computer|compact/i.test(v.name))||english[0]||null;u.pitch=.25;u.rate=.9;u.volume=.85;speechSynthesis.speak(u)}catch{}}
function preferences(){modal('<p class="eyebrow">KEEP IT YOUR WAY</p><h2>Settings</h2><div class="setting row"><div><strong>Sound effects</strong><p>Short effects. No surprise soundtrack.</p></div><button class="toggle '+(prefs.sound?'on':'')+'" data-action="sound-toggle">'+(prefs.sound?'On':'Off')+'</button></div><div class="setting row"><div><strong>Robot announcer</strong><p>Short, low-pitched spoken results.</p></div><button class="toggle '+(prefs.announcer?'on':'')+'" data-action="announcer-toggle">'+(prefs.announcer?'On':'Off')+'</button></div><p class="small muted">The optional answer timer is chosen before a new game. Your preferences are remembered on this device.</p><p class="small muted">Answers and scores stay on this device. No account needed.</p>'+button('Play the opening sting','intro','secondary'))}
function rules(){modal('<p class="eyebrow">THE SHORT VERSION</p><h2>Know the answer.<br>Don’t be obvious.</h2><p>Choose the strongest answer you think nobody else will give. Pass the phone and answer in secret. Matching answers are destroyed: the perils of being obvious.</p>'+pointsPanel()+'<p>Every copy of a matching answer is cancelled, even with different spellings. If nobody survives, nobody scores. Over five rounds, most points wins. Tied champions share the glory.</p><p class="small muted">Different answers with equal values remain distinct; if tied best, each earns 3 total. Every question states its boundaries.</p>')}
function detail(){const finished=['leaderboard','final'].includes(s.stage)||(s.stage==='reveal'&&s.phase>=5);modal('<p class="eyebrow">THE SMALL PRINT, MERCIFULLY SMALL</p><h2>'+esc(question.subject)+'</h2><p>'+esc(finished?question.scope:question.safeScope)+'</p><p class="small muted">'+question.entries.length+' possible answers. A recognised spelling correction is confirmed privately; rank stays hidden until the reveal.</p>'+(finished&&question.source?'<a href="'+esc(question.source)+'" target="_blank" rel="noopener noreferrer">Question source ↗</a>':'<p class="small muted">The reference and full answer ranking are available after the reveal.</p>'))}
function ranking(){const entries=question.entries.slice().sort((a,b)=>(s.mode==='target'?Math.abs(a.value-question.target)-Math.abs(b.value-question.target):s.mode==='high'?b.value-a.value:a.value-b.value)||a.name.localeCompare(b.name));modal('<p class="eyebrow">THE FULL PICTURE</p><h2>Answer ranking</h2><p class="small muted">Strongest first for this challenge. Matching answers were cancelled before awarding the bonus.</p>'+entries.map(e=>'<div class="setting row"><strong>'+esc(e.name)+'</strong><span class="small muted">'+esc(displayValue(question,e))+'</span>'+(e.source?'<a class="tiny" href="'+esc(e.source)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+'</div>').join(''))}
function dispatch(a,el){sound();switch(a){case'intro':intro();break;case'intro-end':showHome();break;case'home':if(s&&!s.demo&&s.stage!=='final')modal('<h2>Take a breather?</h2><p>Your game is saved. Returning here won’t reveal anyone’s answer.</p><div class="actions">'+button('Back to the start','confirm-home')+button('Keep playing','close','secondary')+'</div>');else showHome();break;case'confirm-home':closeModal();showHome();break;case'end-home':saved=null;try{localStorage.removeItem(KEY)}catch{}showHome();break;case'setup':setup=null;setupSet=null;error='';setupScreen();break;case'add':if(setup.length>=10)break;setup.push({name:'',help:false});setupScreen();document.querySelectorAll('[data-name]')[setup.length-1].focus();break;case'remove':setup.splice(+el.dataset.index,1);setupScreen();break;case'help-toggle':setup[+el.dataset.index].help=!setup[+el.dataset.index].help;setupScreen();break;case'start':startGame();break;case'resume':resume();break;case'round-ready':s.challengeReady=true;s.mode=question.defaultMode;s.stage='handover';persist();render();break;case'ready':s.stage='answer';persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'select-answer':selectAnswer(el.dataset.key);break;case'confirm-lock':lockAnswer({raw:confirm.raw,key:confirm.entry?.id??null});break;case'edit-answer':s.draft=confirm.raw;s.stage='answer';delete s.pending;persist();render();if(question.input!=='grid')$('#answer').focus({preventScroll:true});break;case'pass':modal('<h2>Leave this one?</h2><p>A pass scores zero. Sometimes discretion is the better part of trivia.</p><div class="actions">'+button('Pass — zero points','confirm-pass','danger')+button('I’ll think again','close','secondary')+'</div>');break;case'confirm-pass':closeModal();lockAnswer({raw:'Passed',key:null,passed:true});break;case'hint':hint=!hint;$('#hint-slot').innerHTML=hint?'<div class="hint">'+esc(question.hints[s.turn%question.hints.length])+'</div>':'';break;case'scope':detail();break;case'answer-bank':ranking();break;case'skip-reveal':s.revealCount=s.phase===0?1:s.players.length;s.phase=s.phase===0?1:5;persist();render();break;case'replay-reveal':s.revealCount=0;s.revealGroup=0;s.phase=0;persist();render();break;case'scores':s.stage='leaderboard';persist();render();break;case'next':if(s.round===4){s.stage='final';persist();render()}else{s.round++;s.turn=0;s.answers=[];s.mode=bank[s.round][s.deck[s.round]].defaultMode;s.challengeReady=true;s.phase=0;s.stage='round';persist();render()}break;case'play-again':setupSet=null;setup=s.players.map(p=>({name:p.name,help:p.help}));s=null;setupScreen();break;case'demo':demo();break;case'demo-finish':setup=null;setupScreen();break;case'rules':rules();break;case'settings':preferences();break;case'announcer-toggle':prefs.announcer=!prefs.announcer;write(PREF,prefs);preferences();if(prefs.announcer)robotAnnounce('System ready. Avoid the obvious.');break;case'sound-toggle':prefs.sound=!prefs.sound;write(PREF,prefs);preferences();break;case'close':closeModal();break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)dispatch(el.dataset.action,el)});
document.addEventListener('input',e=>{if(e.target.matches('[data-name]'))setup[+e.target.dataset.name].name=e.target.value;if(e.target.id==='answer'&&s){s.draft=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.id==='question-set')setupSet=+e.target.value;if(e.target.id==='setup-timer'){prefs.timer=+e.target.value;write(PREF,prefs)}});
document.addEventListener('submit',e=>{if(e.target.id==='answer-form'){e.preventDefault();propose($('#answer').value)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&s&&['answer','confirm'].includes(s.stage)){s.stage='handover';persist();render()}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
window.DOGame={bank,rounds,match,evaluate,norm,distance,getState:()=>s,getPrefs:()=>prefs,seekReveal:phase=>{s.phase=phase;render()},loadTestState:state=>{s=JSON.parse(JSON.stringify(state));question=current();render()},showHome};
$('.brand').innerHTML=LOGO;
showHome();
})();


</script></body></html>
